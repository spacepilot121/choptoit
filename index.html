function setBackdropCover(image, width = GAME_WIDTH, height = GAME_HEIGHT, alignBottom = false) {
  const src = image.texture?.getSourceImage?.();
  if (!src || !src.width || !src.height) {
    image.setDisplaySize(width, height);
    return image;
  }
  const scale = Math.max(width / src.width, height / src.height);
  image.setScale(scale);
  if (alignBottom) {
    image.setOrigin(0.5, 1);
    image.setPosition(width / 2, height);
  } else {
    image.setOrigin(0.5, 0.5);
    image.setPosition(width / 2, height / 2);
  }
  return image;
}

function setImageScaleToFit(image, maxWidth, maxHeight) {
  const src = image.texture?.getSourceImage?.();
  if (!src || !src.width || !src.height) return image;
  const scale = Math.min(maxWidth / src.width, maxHeight / src.height);
  image.setScale(scale);
  return image;
}

function formatGold(amount) {
  if (amount < 1000) return amount.toString();
  const units = ['k', 'M', 'B', 'T'];
  let unitIndex = -1;
  let value = amount;
  while (value >= 1000 && unitIndex < units.length - 1) {
    value /= 1000;
    unitIndex++;
  }
  const rounded = Math.round(value * 10) / 10;
  const display = rounded % 1 === 0 ? rounded.toFixed(0) : rounded;
  return `${display}${units[unitIndex]}`;
}

function inferGitHubCommitsUrl() {
  const { hostname, pathname } = window.location;
  const cleanPath = pathname.replace(/^\/+|\/+$/g, '');
  const parts = cleanPath ? cleanPath.split('/') : [];

  // GitHub Pages pattern: https://<owner>.github.io/<repo>/
  if (hostname.endsWith('.github.io') && parts.length >= 1) {
    const owner = hostname.split('.')[0];
    const repo = parts[0];
    return `https://github.com/${owner}/${repo}/commits`;
  }

  // Repo page pattern: https://github.com/<owner>/<repo>/...
  if (hostname === 'github.com' && parts.length >= 2) {
    const [owner, repo] = parts;
    return `https://github.com/${owner}/${repo}/commits`;
  }

  return null;
}

const SAVE_VERSION = 2;
const SaveManager = {
  key: 'choptoit-save',
  saveVersion: SAVE_VERSION,
  disabled: false,
  warned: false,
  saveTimeout: null,
  lastSavedRaw: null,
  conflict: false,
  load() {
    if (this.disabled) return;
    try {
      this.lastSavedRaw = localStorage.getItem(this.key);
      let foundSave = false;
      for (const key of [this.key, this.key + '-backup']) {
        const raw = localStorage.getItem(key);
        if (!raw) continue;
        foundSave = true;
        let data;
        try { data = JSON.parse(raw); } catch (_) { continue; }
        if (!this.validate(data)) continue;
        this.apply(data);
        if (key !== this.key) this.recovered = true;
        return;
      }
      // Keep unreadable saves intact until the player chooses a recovery action.
      if (foundSave) { this.unreadable = true; this.disabled = true; }
    } catch (e) {
      this.handleError(e);
    }
  },
  getData() {
    return {
      saveVersion: this.saveVersion,
      gold: player.gold,
      fame,
      xp,
      level,
      currentDay,
      currentMonth,
      currentCity,
      timeOfDay: game?.scene?.scenes[0]?.dayNight?.timeOfDay ?? restoredTimeOfDay,
      killCount,
      campaign: Campaign.state,
      market: marketItems.map(m => ({name:m.name,buy:m.currentBuy,sell:m.currentSell,stock:m.stock})),
      marketSpecials: {buy:dailyBuySpecial,sell:dailySellSpecial},
      citiesUnlocked: cities.filter(c => c.unlocked).map(c => c.name),
      itemsOwned: inventory,
      upgradesOwned: {
        storageLevel: player.storageLevel,
        weaponLevel: player.weaponLevel,
        purchasedUpgrades: gameUpgrades.map(u => !!u.purchased),
      },
    };
  },
  save() {
    if (this.disabled) return;
    if (this.saveTimeout) clearTimeout(this.saveTimeout);
    this.saveTimeout = setTimeout(() => this.performSave(), 500);
  },
  performSave() {
    if (this.saveTimeout) clearTimeout(this.saveTimeout);
    this.saveTimeout = null;
    if (this.disabled) return;
    try {
      if (!this.checkCurrent()) return;
      const previous = localStorage.getItem(this.key);
      if (previous) {
        try { if (this.validate(JSON.parse(previous))) localStorage.setItem(this.key + '-backup', previous); } catch (_) {}
      }
      const next = JSON.stringify(this.getData());
      localStorage.setItem(this.key, next);
      this.lastSavedRaw = next;
    } catch (e) {
      this.handleError(e);
    }
  },
  checkCurrent() {
    if (this.conflict) return false;
    const current = localStorage.getItem(this.key);
    if (current === this.lastSavedRaw) return true;
    this.conflict = true;
    this.disabled = true;
    if (this.saveTimeout) clearTimeout(this.saveTimeout);
    this.saveTimeout = null;
    return false;
  },
  handleError(e) {
    if (!this.warned) {
      console.warn('Saving disabled: localStorage unavailable.', e);
      this.warned = true;
    }
    this.disabled = true;
  },
  validate(data) {
    if (!data || typeof data !== 'object') return false;
    if (data.saveVersion !== undefined && (!Number.isInteger(data.saveVersion) || data.saveVersion < 1 || data.saveVersion > this.saveVersion)) return false;
    const bounded = (value, min, max) => Number.isFinite(value) && value >= min && value <= max;
    if (!bounded(data.gold, 0, Number.MAX_SAFE_INTEGER) || !bounded(data.fame, 0, Number.MAX_SAFE_INTEGER) ||
        !Number.isSafeInteger(data.level) || !bounded(data.level, 1, 1000) || !bounded(data.xp, 0, Number.MAX_SAFE_INTEGER)) return false;
    if (!data.itemsOwned || Array.isArray(data.itemsOwned) || typeof data.itemsOwned !== 'object' ||
        !Object.values(data.itemsOwned).every(n => Number.isSafeInteger(n) && n >= 0 && n <= 160)) return false;
    if (!data.upgradesOwned || !Number.isInteger(data.upgradesOwned.storageLevel) ||
        !bounded(data.upgradesOwned.storageLevel, 1, 16) || !Number.isInteger(data.upgradesOwned.weaponLevel) ||
        !bounded(data.upgradesOwned.weaponLevel, 1, 30)) return false;
    if (!Object.keys(data.itemsOwned).every(name => marketItems.some(item => item.name === name)) ||
        Object.values(data.itemsOwned).reduce((sum, quantity) => sum + quantity, 0) > data.upgradesOwned.storageLevel * 10) return false;
    const hasValidDay = data.currentDay === undefined || (typeof data.currentDay === 'number' && Number.isFinite(data.currentDay));
    const hasValidMonth = data.currentMonth === undefined || (typeof data.currentMonth === 'number' && Number.isFinite(data.currentMonth));
    return data && typeof data.gold === 'number' && typeof data.fame === 'number' &&
      typeof data.xp === 'number' && typeof data.level === 'number' &&
      Array.isArray(data.citiesUnlocked) && typeof data.itemsOwned === 'object' &&
      data.upgradesOwned && typeof data.upgradesOwned.storageLevel === 'number' &&
      typeof data.upgradesOwned.weaponLevel === 'number' &&
      hasValidDay && hasValidMonth;
  },
  apply(data, updateUI = false) {
    player.gold = data.gold || 0;
    fame = data.fame || 0;
    xp = data.xp || 0;
    level = data.level || 1;
    inventory = data.itemsOwned || {};
    if (Array.isArray(data.citiesUnlocked)) {
      cities.forEach(c => { c.unlocked = data.citiesUnlocked.includes(c.name); });
    }
    if (data.upgradesOwned) {
      player.storageLevel = data.upgradesOwned.storageLevel || 1;
      player.maxStorage = player.storageLevel * 10;
      player.weaponLevel = data.upgradesOwned.weaponLevel || 1;
      const purchased = data.upgradesOwned.purchasedUpgrades || [];
      gameUpgrades.forEach((u, i) => { u.purchased = !!purchased[i]; });
      fameMultiplier = Math.max(1, ...gameUpgrades.filter(u => u.purchased).map(u => u.mult));
    }
    currentDay = Phaser.Math.Clamp(Math.floor(typeof data.currentDay === 'number' ? data.currentDay : currentDay), 1, 30);
    currentMonth = Phaser.Math.Clamp(Math.floor(typeof data.currentMonth === 'number' ? data.currentMonth : currentMonth), 0, months.length - 1);
    if (cities.some(c => c.name === data.currentCity)) currentCity = data.currentCity;
    const savedCity = cities.find(c => c.name === currentCity);
    if (savedCity) savedCity.unlocked = true;
    restoredTimeOfDay = Number.isFinite(data.timeOfDay) ? Phaser.Math.Clamp(data.timeOfDay, 0, 0.999999) : 0.2;
    killCount = Number.isSafeInteger(data.killCount) && data.killCount >= 0 ? data.killCount : 0;
    Campaign.restore(data.campaign, currentMonth * 30 + currentDay - 1);
    Campaign.visit(currentCity);
    if (Array.isArray(data.market) && data.market.length === marketItems.length && data.market.every((m,i) =>
        m && m.name === marketItems[i].name && Number.isSafeInteger(m.buy) && m.buy > 0 && m.buy <= 1000000 &&
        Number.isSafeInteger(m.sell) && m.sell > 0 && m.sell <= 1000000 && Number.isSafeInteger(m.stock) && m.stock >= 0 && m.stock <= 10000)) {
      data.market.forEach((m,i) => Object.assign(marketItems[i],{currentBuy:m.buy,currentSell:Math.min(m.buy,m.sell),stock:m.stock}));
      dailyBuySpecial = marketItems.some(m=>m.name===data.marketSpecials?.buy) ? data.marketSpecials.buy : null;
      dailySellSpecial = marketItems.some(m=>m.name===data.marketSpecials?.sell) ? data.marketSpecials.sell : null;
      restoredMarket = true;
    }
    if (dateText) dateText.setText(getDateString());
    xpThreshold = 10;
    for (let i = 1; i < level; i++) {
      xpThreshold = Math.floor(xpThreshold * 1.33);
    }
    if (updateUI) {
      if (goldText) goldText.setText(formatGold(player.gold));
      if (fameText) fameText.setText(formatGold(Math.floor(fame)));
      updateXPUI && updateXPUI();
      updateStorageUI && updateStorageUI();
      updateWeaponsUI && updateWeaponsUI();
      updateMarketUI && updateMarketUI();
      const scene = game.scene.scenes[0];
      if (scene && typeof updateTravelUI === 'function') updateTravelUI(scene);
      updateExecutionerWeaponTexture && updateExecutionerWeaponTexture();
      if (scene) updateUnlockButtons(scene);
    }
  },
  export() {
    return JSON.stringify(this.getData(), null, 2);
  },
  download() {
    const dataStr = this.export();
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'choptoit-save.json';
    a.click();
    URL.revokeObjectURL(url);
  },
  promptImport() {
    const str = prompt('Paste your save JSON:');
    if (!str) return;
    let data;
    try {
      data = JSON.parse(str);
    } catch (e) {
      alert('Invalid save data');
      return;
    }
    if (!this.validate(data)) {
      alert('Invalid save data');
      return;
    }
    this.apply(data, true);
    this.save();
  },
  clear() {
    if (this.saveTimeout) clearTimeout(this.saveTimeout);
    this.saveTimeout = null;
    try {
      localStorage.removeItem(this.key);
      localStorage.removeItem(this.key + '-backup');
      this.lastSavedRaw = null;
      return true;
    } catch (e) { this.handleError(e); return false; }
  },
  restore(data) {
    if (!this.validate(data)) throw new Error('This is not a valid Chop To It save, or it needs a newer game version.');
    const previous = localStorage.getItem(this.key);
    let previousValid = false;
    try { previousValid = this.validate(JSON.parse(previous)); } catch (_) {}
    if (previousValid) localStorage.setItem(this.key + '-backup', previous);
    localStorage.setItem(this.key, JSON.stringify(data));
    this.disabled = true;
  },
  newGame() {
    if (confirm('Start a new game?')) {
      if (!this.clear()) return;
      this.disabled = true;
      location.reload();
    }
  },
  startAutoSave() {
    setInterval(() => this.save(), 30000);
  }
};

// Calculate great-circle distance between two coordinate pairs in miles
function distanceMiles(a, b) {
  const from = cityCoords[a];
  const to = cityCoords[b];
  if (!from || !to) {
    console.warn('Missing city coordinates for travel distance calculation.', { from: a, to: b });
    return 24;
  }
  const [lat1, lon1] = from;
  const [lat2, lon2] = to;
  const R = 6371e3; // metres
  const phi1 = lat1 * Math.PI / 180;
  const phi2 = lat2 * Math.PI / 180;
  const dPhi = (lat2 - lat1) * Math.PI / 180;
  const dLambda = (lon2 - lon1) * Math.PI / 180;
  const aa = Math.sin(dPhi / 2) ** 2 + Math.cos(phi1) * Math.cos(phi2) * Math.sin(dLambda / 2) ** 2;
  const c = 2 * Math.atan2(Math.sqrt(aa), Math.sqrt(1 - aa));
  return (R * c) / 1609.34;
}

// Average pace roughly 24 miles per day
function getTravelDays(from, to) {
  if (from === to) return 0;
  if (!cityCoords[from] || !cityCoords[to]) return 1;
  const miles = distanceMiles(from, to);
  return Math.max(1, Math.round(miles / 24));
}

  });
}

function applyTargetWeather(scene, target) {
  for (const object of [target, target.jester]) {
    if (!object) continue;
    if (object.fogTween) { object.fogTween.stop(); object.fogTween = null; }
    object.setAlpha(1);
    if (!object.fogCleanupBound) {
      object.fogCleanupBound = true;
      object.once('destroy', () => {
        if (object.fogTween) { object.fogTween.stop(); object.fogTween = null; }
      });
    }
    if (FEATURES.weather && currentWeather === 'fog') {
      object.fogTween = scene.tweens.add({ targets: object, alpha: 0.4, yoyo: true, repeat: -1, duration: 800 });
    }
  }
}

function applyRandomWeather(scene) {
  const clearChance = 0.5;
  if (!FEATURES.weather || Math.random() < clearChance) {
    currentWeather = 'clear';
  } else {
    currentWeather = Phaser.Utils.Array.GetRandom(['rain', 'wind', 'fog']);
  }
  windForce = { x: 0, y: 0 };
  weatherText.setText(currentWeather.toUpperCase());
  if (rainEmitter) rainEmitter.stop();
  if (fogEmitter) fogEmitter.stop();
  if (windEmitter) windEmitter.stop();
  let letter = '';
  let arrow = '';
  targetGroup.getChildren().forEach(t => applyTargetWeather(scene, t));
  if (currentWeather === 'wind') {
    windForce.x = Phaser.Math.Between(-100, 100);
    windForce.y = Phaser.Math.Between(-100, 100);
    letter = 'W';
    arrow = arrowForWind(windForce.x, windForce.y);
    if (windEmitter) {
      windEmitter.setSpeedX({ min: windForce.x - 20, max: windForce.x + 20 });
      windEmitter.setSpeedY({ min: windForce.y - 20, max: windForce.y + 20 });
      const zone = createWindEmitZone();
      windEmitter.setEmitZone({ type: 'random', source: zone });
      windEmitter.start();
    }
  } else if (currentWeather === 'fog') {
    letter = 'F';
    if (fogEmitter) fogEmitter.start();
  } else if (currentWeather === 'rain') {
    letter = 'R';
    if (rainEmitter) rainEmitter.start();
  } else if (currentWeather === 'clear') {
    letter = 'C';
  }
  weatherIndicator.setText(letter + arrow);
}

function arrowForWind(x, y) {
  const angle = Math.atan2(y, x);
  const arrows = ['→', '↘', '↓', '↙', '←', '↖', '↑', '↗'];
  let idx = Math.round(angle / (Math.PI / 4));
  if (idx < 0) idx += 8;
  return arrows[idx % 8];
}

// Advance the calendar by a number of days
function advanceDays(days = 1) {
  Campaign.advance(days);
  for (let i = 0; i < days; i++) {
    currentDay++;
    if (currentDay > 30) {
      currentDay = 1;
      currentMonth = (currentMonth + 1) % months.length;
    }
  }
  if (dateText) dateText.setText(getDateString());
  SaveManager.save();
}

// Alias used by the day/night cycle to advance time
function advanceCalendarDays(days = 1) {
  advanceDays(days);
  dailyMarketUpdate();
}

    targets: coin,

function pickClass() {
  const total = classes.reduce((s, c) => s + c.weight, 0);
  let r = Phaser.Math.Between(1, total);
  for (const c of classes) {
    r -= c.weight;
    if (r <= 0) return c;
  }
  return classes[0];
}

const pendingCityBackgrounds = new Map();
function ensureCityBackground(scene, name) {
  const key = `background-${name.toLowerCase()}`;
  if (scene.textures.exists(key)) return Promise.resolve();
  if (pendingCityBackgrounds.has(key)) return pendingCityBackgrounds.get(key);
  const pending = new Promise((resolve, reject) => {
    const img = new Image();
    const timeout = setTimeout(() => { img.onload = img.onerror = null; reject(new Error('The town artwork took too long to load.')); }, 20000);
    img.onload = () => {
      clearTimeout(timeout);
      if (!scene.textures.exists(key)) scene.textures.addImage(key, img);
      resolve();
    };
    img.onerror = () => { clearTimeout(timeout); reject(new Error('The town artwork could not load.')); };
    img.src = cityBackgrounds[name];
  }).finally(() => pendingCityBackgrounds.delete(key));
  pendingCityBackgrounds.set(key, pending);
  return pending;
}

      const max = inventory[item.name] || 0;
      if (max > 0) sellMarketItem(scene, tradeItemIndex, max);
      hideTradeMenu(scene);
    });
  const tradeClose = scene.add.image(440, 0, 'signClose')
    .setOrigin(0, 0)
    .setDisplaySize(100, 100)
    .setInteractive()
    .on('pointerdown', () => { hideTradeMenu(scene); });
  tradeContainer.add([tradeBg, tradeTitle, b1, b10, bMax, s1, s10, sMax, tradeClose, tradeSpaceText]);
  tradeBuyBtns = [b1, b10, bMax];
  tradeSellBtns = [s1, s10, sMax];
  }

  // Set up first day's prices and gossip
  if (restoredMarket) { updateMarketUI(); restoredMarket = false; }
  else dailyMarketUpdate();

  SaveManager.startAutoSave();
  updateUnlockButtons(scene);

  // Text popup
  scene.popupText = scene.add.text(400, 250, '', { font: '24px serif', fill: '#ffffff' })
    .setOrigin(0.5)
    .setVisible(false);

  // Input key for timing
  scene.input.keyboard.on('keydown-SPACE', event => {
    if (event.repeat || event.target?.closest?.('button')) return;
    if (window.MobileGame) window.MobileGame.strike();
    else if (swingActive && inputEnabled) endSwing(scene);
  });
  scene.input.on('pointerdown', () => {
    if (!inputEnabled || menuOpen || window.MobileGame?.isPaused()) return;
    if (awaitingAngle) {
      chooseAngle(scene);
    } else if (awaitingPower) {
      choosePower(scene);
    } else if (swingActive) {
      endSwing(scene);
    }
  });

  // Targets spawn with each prisoner
  if (window.MobileGame) {
    scene.tweens.killTweensOf(logoContainer);
    scene.time.delayedCall(1, () => {
      startGame();
      window.MobileGame.ready(scene);
    });
  }
}

// Helper to fade the overlay that darkens the entire screen.
// Used for menu and travel fades.
let screenFadeTween = null;
function fadeScreenOverlay(scene, alpha, duration = 300, onComplete) {
  if (screenFadeTween) {
    screenFadeTween.stop();
  }
  screenFadeOverlay.setVisible(true);
  screenFadeTween = scene.tweens.add({
    targets: screenFadeOverlay,
    alpha,
    duration,
    onComplete: () => {
      screenFadeTween = null;
      if (alpha === 0) {
        screenFadeOverlay.setVisible(false);
      }
      if (onComplete) onComplete();
    }
  });
}

// Fade only the background layer for dramatic effects, e.g. executioner intro.
let backgroundFadeTween = null;
function fadeBackgroundOverlay(scene, alpha, duration = 300, onComplete) {
  if (backgroundFadeTween) {
    backgroundFadeTween.stop();
  }
  backgroundFadeOverlay.setVisible(true);
  backgroundFadeTween = scene.tweens.add({
    targets: backgroundFadeOverlay,
    alpha,
    duration,
    onComplete: () => {
      backgroundFadeTween = null;
      if (alpha === 0) {
        backgroundFadeOverlay.setVisible(false);
      }
      if (onComplete) onComplete();
    }
  });
}

function buyWeapon(scene, index) {
  const w = weapons[index];
  if (w.purchased) return;
  if (player.gold >= w.cost) {
    player.gold -= w.cost;
    goldText.setText(formatGold(player.gold));
    zoneMods.red += w.effects.red || 0;
    zoneMods.yellow += w.effects.yellow || 0;
    zoneMods.green += w.effects.green || 0;
    updateZones();
    w.purchased = true;
    if (w.ui && w.ui.buy) {
      w.ui.buy.setText('Bought').disableInteractive();
    }
  }
}

function updateZones() {
  // Increase total meter width by 4 pixels per level (2 per end)
  const baseYellow = baseSizes.yellow + (player.weaponLevel - 1) * (4 / 3);
  const scale = baseYellow / baseSizes.yellow;
  const baseRed = baseSizes.red * scale;
  const baseGreen = baseSizes.green * scale;

  redZone.displayWidth = baseRed + zoneMods.red;
  yellowZone.displayWidth = baseYellow + zoneMods.yellow;
  greenZone.displayWidth = baseGreen + zoneMods.green;
}

// Switch between shop tabs and update highlights
// Purchase a fame boosting upgrade
function buyUpgrade(scene, index) {
  const u = gameUpgrades[index];
  if (!u || u.purchased || fame < u.fameReq || u.mult <= fameMultiplier) return false;
  if (player.gold >= u.cost) {
    player.gold -= u.cost;
    goldText.setText(formatGold(player.gold));
    fameMultiplier = Math.max(fameMultiplier, u.mult);
    u.purchased = true;
    if (u.ui && u.ui.buy) {
      u.ui.buy.setText('Bought').disableInteractive();
    }
    SaveManager.save();
    return true;
  }
  return false;
}

// Buying from the trading market
function buyMarketItem(scene, index, qty = 1) {
  const item = marketItems[index];
  if (!item || !Number.isSafeInteger(qty) || qty <= 0 || fame < item.fameReq) return 0;
  qty = Math.min(qty, item.stock || 0);
  const cost = item.currentBuy * qty;
  if (qty > 0 && player.gold >= cost && getInventoryCount() + qty <= player.maxStorage) {
    player.gold -= cost;
    goldText.setText(formatGold(player.gold));
    inventory[item.name] = (inventory[item.name] || 0) + qty;
    item.stock -= qty;
    updateMarketUI();
    showMarketQuote(sellingQuotes);
    SaveManager.save();
    return qty;
  }
  return 0;
}

// Selling items the player owns
function sellMarketItem(scene, index, qty = 1) {
  const item = marketItems[index];
  if (!item || !Number.isSafeInteger(qty) || qty <= 0) return 0;
  if ((inventory[item.name] || 0) >= qty) {
    inventory[item.name] -= qty;
    item.stock = (item.stock || 0) + qty;
    addGold(scene, item.currentSell * qty);
    Campaign.state.sold += qty;
    updateMarketUI();
    showMarketQuote(buyingQuotes);
    SaveManager.save();
    return qty;
  }
  return 0;
}


// Update market text lines with prices and inventory
function updateMarketUI() {
  marketItems.forEach(m => {
    if (!m.ui) return;
    const qty = inventory[m.name] || 0;
    const locked = fame < m.fameReq;
    m.ui.name.setText(locked ? `${m.name} (F${m.fameReq})` : m.name);
    m.ui.buyPrice.setText(locked ? '-' : `${m.currentBuy}g`);
    m.ui.sellPrice.setText(locked ? '-' : `${m.currentSell}g`);
    m.ui.stockText.setText(locked ? '-' : m.stock);
    m.ui.qtyText.setText(qty);
    const canBuy = !locked && player.gold >= m.currentBuy && getInventoryCount() < player.maxStorage && m.stock > 0;
    const canSell = qty >= 1;
    m.ui.buyBtn.setFill(canBuy ? '#00ff00' : '#777777');
    m.ui.sellBtn.setFill(canSell ? '#00ff00' : '#777777');
  });
}

function updateTravelUI(scene) {
  cities.forEach(c => {
    if (!c.ui) return;
    const locked = !c.unlocked;
    const days = getTravelDays(currentCity, c.name);
    const title = c.name === currentCity ? c.name : `${c.name} — ${days} days`;
    c.ui.title.setText(title);
    if (c.name === currentCity) {
      c.ui.btn.setText('[Here]');
      c.ui.btn.setFill('#777777');
    } else if (locked) {
      const affordable = fame >= nextCityKeyCost;
      c.ui.btn.setText(`[Buy Key: ${nextCityKeyCost} Fame]`);
      c.ui.btn.setFill(affordable ? '#00ff00' : '#777777');
    } else {
      c.ui.btn.setText('[Go]');
      c.ui.btn.setFill('#00ff00');
    }
  });
}

function showTravelMenu(scene, region = travelRegion) {
  travelRegion = region;
  travelList.removeAll(true);
  cities.forEach(c => { if (c.ui) delete c.ui; });

  // If no region selected, present North/South options with placeholders
  if (!travelRegion) {
    const northPlaceholder = scene.add
      .image(200, 300, 'mapNorth')
      .setOrigin(0.5)
      .setDisplaySize(250, 400)
      .setInteractive()
      .on('pointerdown', () => showTravelMenu(scene, 'north'));
    const southPlaceholder = scene.add
      .image(600, 300, 'mapSouth')
      .setOrigin(0.5)
      .setDisplaySize(250, 400)
      .setInteractive()
      .on('pointerdown', () => showTravelMenu(scene, 'south'));
    const prompt = scene.add.text(400, 560, 'Where would you like to go?', { font: '24px monospace', fill: '#ffd700' })
      .setOrigin(0.5)
      .setStroke('#000000', 3);
    travelList.add([northPlaceholder, southPlaceholder, prompt]);
    return;
  }
  const regionCities = cities.filter(c => c.region === travelRegion);
  const totalCities = regionCities.length;
  regionCities.forEach((city, idx) => {
    const y = 120 + idx * 40;
    const title = scene.add.text(40, y, '', {
      font: '18px monospace',
      fill: '#ffffaa',
      wordWrap: { width: 320 }
    }).setStroke('#000000', 3);
    const btn = scene.add.text(250, y, '[Go]', {
      font: '18px monospace',
      fill: '#00ff00'
    })
      .setStroke('#000000', 3)
      .setInteractive()
      .on('pointerdown', () => {
        if (!city.unlocked) {
          if (fame >= nextCityKeyCost) {
            fame -= nextCityKeyCost;
            fameText.setText(formatGold(Math.floor(fame)));
            city.unlocked = true;
            nextCityKeyCost += 10;
            updateTravelUI(scene);
          }
          return;
        }
        travelToCity(scene, city);
      });
    travelList.add([title, btn]);
    city.ui = { title, btn };
  });

  const backBtn = scene.add.text(40, 120 + totalCities * 40 + 10, '[Back]', {
    font: '18px monospace',
    fill: '#ffff00'
  })
    .setStroke('#000000', 3)
    .setInteractive()
    .on('pointerdown', () => showTravelMenu(scene, null));
  travelList.add(backBtn);

  updateTravelUI(scene);
}

// Cost to upgrade to the next weapon level
function getWeaponUpgradeCost() {
  const cost = 10 * Math.pow(WEAPON_UPGRADE_RATIO, player.weaponLevel - 1);
  return Math.ceil(cost - 1e-6);
}

// Weapon levels should affect actual strike strength, not just meter leniency.
// Level 1 => 1.00x, then +6% per level to keep scaling meaningful but controlled.
function getWeaponPowerMultiplier() {
  return 1 + ((player.weaponLevel - 1) * 0.06);
}

// Fade completely to black, change cities, then reveal the new scene.
function travelToCity(scene, city) {
  const days = getTravelDays(currentCity, city.name);
  toggleTravel(scene, false, false);
  setGoldChestVisible(false);
  // Clear any residual screen dim from the travel menu before pausing the scene
  if (screenFadeTween) {
    screenFadeTween.stop();
    screenFadeTween = null;
  }
  screenFadeOverlay.setAlpha(0);
  screenFadeOverlay.setVisible(false);
  scene.scene.launch('TravelScene', { city, days, mainScene: scene });
  scene.scene.pause();
}

  } else if (currentWeather === 'wind' && windEmitter && windParts) {

  startSwingMeter(scene);

// Update the background image based on the current city. If a specific
// texture is missing fallback to the generic background.
function updateBackground(scene) {
  const key = `background-${currentCity.toLowerCase()}`;
  if (scene.textures.exists(key)) {
    backgroundRect.setTexture(key);
  } else {
    backgroundRect.setTexture(scene.textures.exists('background') ? 'background' : `background-${currentCity.toLowerCase()}`);
  }
  setBackdropCover(backgroundRect, GAME_WIDTH, GAME_HEIGHT, true);
  backgroundRect.y -= cityBackdropOffsets[currentCity] || 0;
  if (stage) stage.setAlpha(currentCity in cityBackdropOffsets ? 0 : 1);
}

function selectCity(scene, city) {
  if (!city.unlocked) return;
  if (city.name === currentCity) return;
  currentCity = city.name;
  // backgroundRect.setTint(city.bgColor); // disabled per request
  updateBackground(scene);
  locationText.setText(currentCity);
  // Ensure the travel UI overlay is hidden before starting the transition.
  // Force-close the travel menu in case it somehow remained visible
  // and ensure the dimming overlay disappears when travelling.
  travelOverlay?.setVisible(false);
  travelContainer?.setVisible(false);
  // Also hide other overlays in case they were inadvertently left open.
  shopOverlay?.setVisible(false);
  shopContainer?.setVisible(false);
  tradeOverlay?.setVisible(false);
  tradeContainer?.setVisible(false);
  // Reset the darkness overlay and begin the new city's intro fresh.
  // resetBackOverlay(scene);
  // Directly reset for the new city without fading the camera first.
  resetForNewCity(scene);
  applyRandomWeather(scene);
  roundCount = 1;
  // Extra safety: hide the travel overlay again in case any async events
  // re-enabled it during the city transition.
  travelOverlay?.setVisible(false);
  setGoldChestVisible(true);
}

function beheadPrisoner(scene, bloodAmount, angleDeg, power = 1) {
  if (headResetEvent) {
    headResetEvent.remove(false);
    headResetEvent = null;
  }
  const angle = angleDeg !== undefined ? angleDeg : Phaser.Math.Between(-110, -70);
  const rad = Phaser.Math.DegToRad(angle);
  const weaponPowerMultiplier = getWeaponPowerMultiplier();
  const finalStrikePower = power * weaponPowerMultiplier;
  const neckX = prisoner.x;
  const neckY = prisoner.y - 10;
  bloodEmitter.explode(Math.min(32,bloodAmount), neckX, neckY);
  const headX0 = prisoner.x + prisonerHead.x;
  const headY0 = prisoner.y + prisonerHead.y;
  headEmitter.explode(Math.min(18,bloodAmount / 2), headX0, headY0);

  if (lastGoldGain > 0) {
    showGoldGain(scene, lastGoldGain);
    lastGoldGain = 0;
  }

  // Create a physics body using the prisoner sprite for the falling corpse
  const corpse = scene.add.image(prisoner.x, prisoner.y + 50, 'castBodies','0')
    .setOrigin(0.5, 1)
    .setDepth(0.5);
  CastArt.body(corpse,prisonerBodyKey,prisonerClass.name);
  scene.physics.world.enable(corpse);
  bodyGroup.add(corpse);
  corpse.isCorpse = true;
  corpse.bounceCount = 0;
  corpse.body.onWorldBounds = true;
  corpse.body.setBounce(0.05);
  corpse.body.setCollideWorldBounds(true);
  corpse.body.setDrag(50, 0);
  const corpseSpeed = 80 * finalStrikePower;
  // Throw the body based on the chosen slash angle and power
  corpse.body.setVelocity(Math.sin(rad) * corpseSpeed, Math.cos(rad) * corpseSpeed);
  // Spin faster so bodies topple onto their side
  corpse.body.setAngularVelocity(Phaser.Math.Between(-200, 200));

  // Pumping neck spurts while the body tumbles
  bloodEmitter.startFollow(corpse, 0, -50);
  bloodEmitter.setFrequency(60);
  bloodEmitter.setQuantity(2);
  bloodEmitter.start();
  let pumpOn = true;
  if (neckPumpEvent) {
    neckPumpEvent.remove(false);
    neckPumpEvent = null;
  }
  neckPumpEvent = scene.time.addEvent({
    delay: 200,
    repeat: 6,
    callback: () => {
      pumpOn = !pumpOn;
      if (pumpOn) {
        bloodEmitter.start();
      } else {
        bloodEmitter.stop();
      }
    }
  });
  scene.time.delayedCall(1600, () => {
    bloodEmitter.stop();
    bloodEmitter.stopFollow();
    if (neckPumpEvent) {
      neckPumpEvent.remove(false);
      neckPumpEvent = null;
    }
  });

  // Reveal and grow the blood pool once the head is off
  bloodPool.setVisible(true);
  bloodPool.displayHeight = Math.min(bloodPool.displayHeight + 6, 300);
  stageBlood.setVisible(true);
  stageBlood.displayWidth = Math.min(stageBlood.displayWidth + 5, 300);

  // Hide the template prisoner while the physics body takes over
  prisoner.setVisible(false);

  // Spawn a new flying head sprite
  const flyingHead = scene.add.image(headX0, headY0, 'castHeads', '0')
    .setOrigin(0.5)
    .setDepth(0.8);
  CastArt.head(flyingHead,prisonerHeadKey);
  CastArt.expression(flyingHead,'startled');
  scene.physics.world.enable(flyingHead);
  bodyGroup.add(flyingHead);
  flyingHead.isCorpse = true;
  flyingHead.isHead = true;
  flyingHead.bounceCount = 0;
  flyingHead.power = finalStrikePower;
  flyingHead.prevX = flyingHead.x;
  flyingHead.prevY = flyingHead.y;
  const hBody = flyingHead.body;
  scene.physics.add.overlap(flyingHead, targetGroup, (head, target) => {
    handleTargetHit(scene, target, head);
  });
  hBody.setAllowGravity(true);
  hBody.onWorldBounds = true;
  hBody.setCollideWorldBounds(true);
  hBody.checkCollision.left = true;
  hBody.checkCollision.right = true;
  hBody.checkCollision.up = false;
  hBody.setBounce(0.6);
  hBody.setDrag(50, 0);
  if (FEATURES.weather && currentWeather === 'rain') {
    hBody.setGravityY(0);
    flyingHead.rainGravityApplied = false;
  } else {
    hBody.setGravityY(0);
  }
  const {x:vx,y:vy} = ChopCore.launchVelocity(angle,power,weaponPowerMultiplier,FEATURES.weather && currentWeather === 'wind' ? windForce : {x:0,y:0});
  hBody.setVelocity(vx, vy);
  hBody.setAngularVelocity(Phaser.Math.Between(-200, 200));

  headResetEvent = scene.time.delayedCall(2500, () => {
    headEmitter.stop();
    headEmitter.stopFollow();
    bloodEmitter.stop();
    bloodEmitter.stopFollow();
    if (neckPumpEvent) {
      neckPumpEvent.remove(false);
      neckPumpEvent = null;
    }
    headResetEvent = null;
  });

  // Continuous spurting from the flying head
  headEmitter.startFollow(flyingHead, 0, 15);
  headEmitter.setFrequency(20);
  headEmitter.setQuantity(2);
  headEmitter.start();
}

function settleHead(scene,head) {
  if(head.hasSettled)return;head.hasSettled=true;
  CastArt.expression(head,'dazed');head.setAlpha(1);head.setScale(58/128);head.setAngle(Phaser.Math.Between(-18,18));
  const column=Math.max(0,Math.min(19,Math.floor(head.x/40)));
  head.y=GROUND_Y-head.displayHeight/2-Math.min(240,scene.headPileCounts[column]++*12);
  head.setDepth(31);
  if(head.body){head.body.stop();head.body.setAllowGravity(false);head.body.enable=false;}
}

function chooseAngle(scene) {
  if (!awaitingAngle) return;
  awaitingAngle = false;
  if (arrowTween) arrowTween.stop();
  selectedAngle = aimArrow.angle;
  // start power selection tween
  // grow the arrow length only, keeping width constant
  aimArrow.scaleX = 1;

    scaleY: { from: 0.5, to: 2 },
    duration: 800,

function choosePower(scene) {

function resetHead(scene) {
  if (headResetEvent) {
    headResetEvent.remove(false);
    headResetEvent = null;
  }
  if (neckPumpEvent) {
    neckPumpEvent.remove(false);
    neckPumpEvent = null;
  }
  headEmitter.stop();
  headEmitter.stopFollow();
  bloodEmitter.stop();
  bloodEmitter.stopFollow();
  if (prisonerHead.body) {
    prisonerHead.body.stop();
    prisonerHead.body.setAllowGravity(false);
    scene.physics.world.disable(prisonerHead);
  }
  if (prisonerHead.parentContainer !== prisoner) {
    scene.children.remove(prisonerHead);
    prisoner.add(prisonerHead);
  }
  prisonerHead.setPosition(0, -64);
  prisonerHead.setRotation(0);
  prisonerBody.setAngle(0);
  prisonerBody.y = 50;
  prisoner.setAngle(0);
}



function retirePreviousRoundTargets(scene) {
  if (!targetGroup) return;
  // Each set of pole targets belongs to one customer. Let unhit jesters leave
  // before the next set arrives, so a long streak does not bury the stage.
  targetGroup.getChildren().filter(target => target.jester && !target.collected).forEach(target => {
    const jester = target.jester;
    if (target.moveTween) target.moveTween.stop();
    if (target.yorkWaveTween) target.yorkWaveTween.stop();
    if (target.barrelPulseTween) target.barrelPulseTween.stop();
    if (target.barrelBlinkEvent) target.barrelBlinkEvent.remove(false);
    scene.tweens.killTweensOf(target);
    scene.tweens.killTweensOf(jester);
    target.collected = true;
    if (target.body) target.body.enable = false;
    targetGroup.remove(target);
    const exitX = jester.startFromRight ? GAME_WIDTH + 100 : -100;
    scene.tweens.add({
      targets: [jester, target],
      x: exitX,
      alpha: 0,
      duration: 650,
      ease: 'Sine.easeIn',
      onComplete: () => { jester.destroy(); target.destroy(); }
    });
  });
}

function spawnPrisoner(scene, fromRight, withTarget = true) {
  retirePreviousRoundTargets(scene);
  const city = cities.find(c => c.name === currentCity);
  roundCount++;
  if (FEATURES.weather && (roundCount === 1 || roundCount % 5 === 1)) {
    applyRandomWeather(scene);
  }
  // Temporarily disable background tinting when prisoners spawn
  // so we can determine if it is causing issues.
  // if (city) backgroundRect.setTint(city.bgColor);
  // Disable automatic dimming when a new prisoner spawns. Previously this
  // block would fade in the backOverlay to darken the scene whenever the
  // overlay's alpha was 0. This is temporarily removed as requested.
  // if (backOverlay.alpha === 0) {
  //   backOverlay.setAlpha(0);

  CastArt.head(prisonerHeadSprite,prisonerHeadKey);

  if (withTarget) {
    const targetCount = Phaser.Math.Between(1, 3);
    const usedTargetXs = [];
    for (let i = 0; i < targetCount; i++) {
      spawnTarget(scene, usedTargetXs);

  if (withTarget && shouldSpawnYorkRingPlatformEvent()) {
    spawnYorkRingPlatformEvent(scene);
  }
  if (withTarget && shouldSpawnYorkFlyingIslandEvent()) {
    spawnYorkFlyingIslandEvent(scene);
  }
  baseSwingSpeed = prisonerClass.speed;

  prisonerBody.y = 50;

function startSwingMeter(scene) {
  if (hideMeterEvent) {
    hideMeterEvent.remove(false);
    hideMeterEvent = null;
  }
  if (arrowTween) arrowTween.stop();
  if (arrowPowerTween) arrowPowerTween.stop();
  aimArrow.setVisible(false);
  awaitingAngle = false;
  awaitingPower = false;
  swingActive = true;
  betweenSwings = false;
  inputEnabled = false;
  scene.time.delayedCall(200, () => { inputEnabled = true; });
  // Reset positions before making the meter visible to avoid visual jumps
  cursor.x = 250;
  const zoneX = 400;
  redZone.x = zoneX;
  yellowZone.x = zoneX;
  greenZone.x = zoneX;

  updateZones();

  cursor.setVisible(true);
  swingBar.setVisible(true);
  redZone.setVisible(true);
  yellowZone.setVisible(true);
  greenZone.setVisible(true);
  // leave bloodPool visible between swings
  scene.popupText.setVisible(false);

  // Ensure head is attached and physics disabled
  resetHead(scene);



  // Meter only starts once prisoner is in position
}

function endSwing(scene) {
  swingActive = false;
  betweenSwings = true;
  cursor.setVisible(false);
  const accuracy = Math.abs(cursor.x - redZone.x);
  let payout = 0;
  let message = '';
  let bloodAmount;
  let missed = false;
  let spawnSide = null;
  let spawnDelay = 500;
  if (accuracy <= greenZone.displayWidth / 2) {
    payout = 10;
    message = 'Perfect!';
    bloodAmount = 150; // big spurt
  } else if (accuracy <= yellowZone.displayWidth / 2) {
    payout = 5;
    message = 'Close!';
    bloodAmount = 60;
  } else if (accuracy <= redZone.displayWidth / 2) {
    payout = 2;
    message = 'Messy...';
    bloodAmount = 20;
  } else {
    payout = -2;
    bloodAmount = 5;
    missed = true;
  }

  // overall more blood
  bloodAmount *= 1.5;

  if (missed) {
    missStreak++;
    let strikeMsg = `Strike ${missStreak}`;
    if (missStreak >= 3) {
      payout -= 20;
      strikeMsg = 'Strike 3\nSaved!';
      missStreak = 0;
      savePrisoner(scene);
      spawnSide = 'left';
      pendingSpawnSide = 'left';
      spawnDelay = 2000; // wait for the freed prisoner to exit right
    }
    message = `Missed!\n${strikeMsg}`;
    killStreak = 0;
    speedMultiplier = 1;
    swingSpeed = baseSwingSpeed * speedMultiplier;
    streakMultiplierText.setText(`x${killStreak}`);
  } else {
    missStreak = 0;
    killCount++;
    killStreak++;
    if (killStreak > 1) {
      speedMultiplier = Math.min(1.65, speedMultiplier * 1.035);
    }
    swingSpeed = baseSwingSpeed * speedMultiplier;
    killText.setText(`Kills: ${killCount}`);
    streakMultiplierText.setText(`x${killStreak}`);
    addXP(scene, 1);
    showAimArrow(scene, bloodAmount, 'left');
    spawnSide = null;
    spawnDelay = 0;
  }
  missText.setText(`Misses: ${missStreak}`);

  const goldGain = missed ? payout : payout * killStreak;
  addGold(scene, goldGain);
  if (!missed && goldGain > 0) {
    lastGoldGain = goldGain;
  }

  // Increase and show blood bursts
  if (missed) {
    const neckX = prisoner.x;
    const neckY = prisoner.y - 10;
    bloodEmitter.explode(bloodAmount, neckX, neckY);
    const headX = prisoner.x + prisonerHead.x;
    const headY = prisoner.y + prisonerHead.y;
    headEmitter.explode(bloodAmount / 2, headX, headY);
  }

  // Show popup
  scene.popupText.setText(message);
  scene.popupText.setVisible(true);
  window.MobileGame?.feedback(!missed ? `${message} · +${goldGain} gold · ${killStreak} in a row` : `${message} · streak reset`, !missed);

  if (!missed) window.MobileGame?.combo(killStreak,goldGain);
  SaveManager.save();

  // Leave the meter visible briefly so players can see the result
  hideMeterEvent = scene.time.delayedCall(1000, () => {
    swingBar.setVisible(false);
    redZone.setVisible(false);
    yellowZone.setVisible(false);
    greenZone.setVisible(false);
    scene.time.delayedCall(spawnDelay, () => {
      if (awaitingAngle || awaitingPower) {
        return;
      }
      if (spawnSide) {
        spawnPrisoner(scene, spawnSide === 'right');
      } else {
        startSwingMeter(scene);
      }
    });
  });
}

function gainFame(scene, npc, amount = 1) {
  const previousFame = fame;
  fame = Math.max(0, fame + amount * (amount > 0 ? fameMultiplier : 1));
  const fameGain = fame - previousFame;
  fameText.setText(formatGold(Math.floor(fame)));
  if (amount > 0) addXP(scene, 5 * amount);
  SaveManager.save();
  const coinsToSpawn = Math.max(0, Math.floor(fameGain));
  for (let i = 0; i < coinsToSpawn; i++) {
    scene.time.delayedCall(i * 100, () => spawnFameCoin(scene));
  }
  const fameLabel = `${fameGain > 0 ? '+' : ''}${Number(fameGain.toFixed(1))} fame`;
  const labels = {woodenShield:'Shield broken',explodingBarrel:'Barrel lit',royal:'Royal target',holyMonk:'Avoid the monks',bird:'Crow hit'};
  if (amount !== 0) window.MobileGame?.feedback(`${labels[npc.targetType] || (npc.isYorkTallWaver ? 'High target' : 'Target hit')} · ${fameLabel}${npc.targetType === 'bird' ? ' · +1 gold' : ''}`, amount > 0);
  const popup = scene.add.text(npc.x, npc.y - 40, fameLabel, {
    font: '20px monospace',
    fill: '#ffff00'
  }).setOrigin(0.5);
  scene.tweens.add({
    targets: popup,
    y: popup.y - 20,
    alpha: 0,
    duration: 800,
    onComplete: () => popup.destroy()
  });
  // Jester will run off when the target hits the ground
}

function showGoldGain(scene, amount) {
  const popup = scene.add.text(prisoner.x, prisoner.y - 40, `+${formatGold(amount)} Gold`, {
    font: '20px monospace',
    fill: '#ffff88'
  }).setOrigin(0.5);
  scene.tweens.add({
    targets: popup,
    y: popup.y - 20,
    alpha: 0,
    duration: 800,
    onComplete: () => popup.destroy()
  });
}

function handleTargetHit(scene, target, head) {
  if (target.collected) return;
  if (target.targetType === 'woodenShield' && head && head.power < 1.5) {
    head.body.setVelocityX(-head.body.velocity.x * 0.5);
    if (!target.shieldFeedbackAt || scene.time.now - target.shieldFeedbackAt > 700) {
      target.shieldFeedbackAt = scene.time.now;
      window.MobileGame?.feedback('Shield blocked · use more power', false);
    }
    return;
  }
  target.collected = true;
  if(head && target.targetType!=='holyMonk' && !(target.targetType==='bird' && target.birdKind==='dove')) {
    head.targetCombo=(head.targetCombo || 0)+1;
    if(head.targetCombo>1){const bonus=Math.min(5,head.targetCombo-1);addGold(scene,bonus);window.MobileGame?.combo(head.targetCombo,bonus,'targets');}
  }
  if (target.targetType !== 'holyMonk' && !(target.targetType === 'bird' && target.birdKind === 'dove')) Campaign.state.targets++;
  if (target.moveTween) { target.moveTween.stop(); target.moveTween = null; }
  if (target.yorkWaveTween) { target.yorkWaveTween.stop(); target.yorkWaveTween = null; }
  const jester = target.jester;
  let fameGain = 1;
  if (target.isMoving) fameGain *= 2;
  if (target.targetType === 'royal') fameGain *= 5;
  if (target.targetType === 'holyMonk') fameGain = -2;
  fameGain *= target.fameMultiplier || 1;
  if (target.targetType === 'bird') {
    bloodFireworkEmitter.explode(25, target.x, target.y);
    if (target.birdKind === 'dove') {
      const lostFame = Math.min(1, fame);
      fame = Math.max(0, fame - 1);
      window.MobileGame?.feedback(`Avoid the doves · ${lostFame > 0 ? `-${lostFame} fame` : 'no fame left to lose'}`, false);
      fameText.setText(formatGold(Math.floor(fame)));
      fameGain = 0;
    } else {
      gainFame(scene, target, 1);
      addGold(scene, 1);
      fameGain = 0;
    }
    SaveManager.save();
    targetGroup.remove(target);
    target.body.setVelocity(0, 0);
    target.body.setAllowGravity(false);
    target.body.setImmovable(true);
    target.body.setCollideWorldBounds(false);
    target.body.enable = false;
    scene.tweens.add({
      targets: target,
      y: 560,
      duration: 600,
      ease: 'Linear',
      onComplete: () => target.destroy()
    });
    return;
  }
  gainFame(scene, target, fameGain);
  if (target.targetType === 'explodingBarrel') {
    armExplodingBarrel(scene, target, head);
    return;
  }
  targetGroup.remove(target);
  // blood spray at impact
  splatEmitter.explode(15, target.x, target.y);
  target.body.setVelocity(0, 0);
  target.body.setAllowGravity(false);
  target.body.setImmovable(true);
  target.body.setCollideWorldBounds(false);
  target.body.enable = false;
  const dropY = jester ? jester.y + 30 : target.y + 30;
  scene.tweens.add({
    targets: target,
    // Drop the target down near the jester's feet
    y: dropY,
    duration: 300,
    ease: 'Linear',
    onComplete: () => {
      if (jester && !jester.running) {
        jester.running = true;
        const offX = jester.startFromRight ? 900 : -100;
        scene.tweens.add({
          targets: [jester, target],
          x: offX,
          duration: 1500,
          ease: 'Linear',
          onComplete: () => {
            jester.destroy();
            target.destroy();
          }
        });
      }
    }
  });
}

function armExplodingBarrel(scene, target, head) {
  if (target.barrelArmed || target.barrelExploded) return;
  target.barrelArmed = true;
  if (target.body) {
    target.body.setVelocity(0, 0);
    target.body.setAllowGravity(false);
    target.body.setImmovable(true);
    target.body.setCollideWorldBounds(false);
    target.body.enable = false;
  }
  target.setScale(1);
  target.barrelPulseTween = scene.tweens.add({
    targets: target,
    scaleX: 1.08,
    scaleY: 1.08,
    duration: 120,
    yoyo: true,
    repeat: -1,
    ease: 'Sine.easeInOut'
  });
  let blinkRed = false;
  target.barrelBlinkEvent = scene.time.addEvent({
    delay: 100,
    loop: true,
    callback: () => {
      if (!target.active) return;
      blinkRed = !blinkRed;
      if (target.barrelBodyRect) {
        target.barrelBodyRect.setFillStyle(blinkRed ? 0xff3333 : 0xffffff);
      }
      if (target.barrelFuseRect) {
        target.barrelFuseRect.setFillStyle(blinkRed ? 0xffffff : 0xff3333);
      }
    }
  });
  scene.time.delayedCall(700, () => detonateExplodingBarrel(scene, target, head));
}

function detonateExplodingBarrel(scene, target, head) {
  if (!target || !target.active || target.barrelExploded) return;
  target.barrelExploded = true;
  if (target.barrelBlinkEvent) {
    target.barrelBlinkEvent.remove(false);
    target.barrelBlinkEvent = null;
  }
  if (target.barrelPulseTween) {
    target.barrelPulseTween.stop();
    target.barrelPulseTween = null;
  }
  target.setScale(1);
  targetGroup.getChildren().forEach(t => {
    if (!t.collected && Phaser.Math.Distance.Between(t.x, t.y, target.x, target.y) < 300) {
      handleTargetHit(scene, t, head);
    }
  });
  targetGroup.remove(target);
  fireworkEmitter.explode(25, target.x, target.y);
  fireworkCloseEmitter.explode(40, target.x, target.y);
  const jester = target.jester;
  if (jester && !jester.running) {
    jester.running = true;
    const offX = jester.startFromRight ? 900 : -100;
    scene.tweens.add({
      targets: jester,
      x: offX,
      duration: 1500,
      ease: 'Linear',
      onComplete: () => jester.destroy()
    });
  }
  target.destroy();
}

function getFlyingIslandMetrics(islandEvent) {
  if (!islandEvent) return null;

  const y = islandEvent.container?.y ?? islandEvent.y ?? 0;
  const greenCenterX = x;
  const greenCenterY = y - 18;
  const greenRadiusX = 114;
  const greenRadiusY = 28;
  const landingTopY = greenCenterY - 14;
  const holeX = x + 30;
  const holeY = y - 23;
  return {
    x,
    y,
    greenCenterX,
    greenCenterY,
    greenRadiusX,
    greenRadiusY,
    landingTopY,
    holeX,
    holeY,
    holeRadius: 12,
    islandHalfWidth: 136,
    islandHalfHeight: 62
  };
}

function updateFlyingIslandEvent(scene, islandEvent) {
  if (!islandEvent || !islandEvent.active) return;
  if (currentCity !== 'York') {
    cleanupYorkFlyingIslandEvent(scene);
    return;
  }
  if (islandEvent.phase !== 'success') {
    const bobOffset = Math.sin((scene.time.now * 0.0025) + islandEvent.bobPhase) * islandEvent.bobAmount;
    islandEvent.container.y = islandEvent.settleY + bobOffset;
  }
  if (islandEvent.phase === 'leaving' && !islandEvent.leaveTween) {
    const exitX = islandEvent.container.x < CENTER_X ? -220 : GAME_WIDTH + 220;
    islandEvent.leaveTween = scene.tweens.add({
      targets: islandEvent.container,
      x: exitX,
      alpha: 0.75,
      duration: 1400,
      ease: 'Sine.easeIn',
      onComplete: () => cleanupYorkFlyingIslandEvent(scene)
    });
  }
  if (!bodyGroup) return;
  bodyGroup.getChildren().forEach(head => {
    if (!head?.isHead || !head.body) return;
    if (head.flyingIslandGreenUntil && scene.time.now < head.flyingIslandGreenUntil) {
      head.body.setDrag(220, 0);
      head.body.setAngularVelocity(head.body.angularVelocity * 0.94);
    } else if (head.flyingIslandGreenUntil) {
      head.flyingIslandGreenUntil = 0;
      head.body.setDrag(50, 0);
    }
  });
}

function isPointInsideFlyingIslandGreen(px, py, islandEvent, padding = 0) {
  const metrics = getFlyingIslandMetrics(islandEvent);
  if (!metrics) return false;
  const dx = px - metrics.greenCenterX;
  const dy = py - metrics.greenCenterY;
  const rx = metrics.greenRadiusX + padding;
  const ry = metrics.greenRadiusY + padding;
  return ((dx * dx) / (rx * rx)) + ((dy * dy) / (ry * ry)) <= 1;
}

function handleFlyingIslandGreenBounce(scene, head, islandEvent) {
  if (!head?.active || !head.body || !islandEvent || islandEvent.success) return false;
  const metrics = getFlyingIslandMetrics(islandEvent);
  const prevX = head.prevX ?? head.x;
  const prevY = head.prevY ?? head.y;
  const currentX = head.x;
  const currentY = head.y;
  const headRadius = Math.max(8, (head.displayWidth || 30) * 0.18);
  const aboveSurfaceLastFrame = prevY <= metrics.landingTopY + headRadius;
  const reachedSurface = currentY >= metrics.landingTopY - headRadius && currentY <= metrics.greenCenterY + metrics.greenRadiusY + headRadius;
  const insideGreen = isPointInsideFlyingIslandGreen(currentX, currentY, islandEvent, headRadius * 0.8);
  const nearHole = Phaser.Math.Distance.Between(currentX, currentY, metrics.holeX, metrics.holeY) <= metrics.holeRadius + headRadius + 4;
  const withinSideBounds = Math.abs(currentX - metrics.x) <= metrics.islandHalfWidth - 8;
  const descending = head.body.velocity.y >= -10;
  if (!aboveSurfaceLastFrame || !reachedSurface || !insideGreen || nearHole || !withinSideBounds || !descending) return false;
  head.y = metrics.landingTopY - headRadius + 2;
  head.body.setVelocity(
    head.body.velocity.x * 0.72,
    Math.max(-58, -Math.abs(head.body.velocity.y) * 0.18 - 8)
  );
  head.body.setAngularVelocity(head.body.angularVelocity * 0.25);
  head.body.setDrag(220, 0);
  head.flyingIslandGreenUntil = scene.time.now + 260;
  return true;
}

function didHeadSinkFlyingIslandHole(head, islandEvent, previousX, previousY, currentX, currentY) {
  if (!head?.active || !head.body || !islandEvent || islandEvent.success) return false;
  if (head.flyingIslandSunk) return false;
  const metrics = getFlyingIslandMetrics(islandEvent);
  const headRadius = Math.max(7, (head.displayWidth || 30) * 0.14);
  const sinkRadius = Math.max(5, metrics.holeRadius - headRadius * 0.2);
  const minDistSq = pointSegmentDistanceSq(metrics.holeX, metrics.holeY, previousX, previousY, currentX, currentY);
  const descending = head.body.velocity.y >= -20 || currentY >= previousY;
  const onGreenPath = isPointInsideFlyingIslandGreen(currentX, currentY, islandEvent, headRadius) || isPointInsideFlyingIslandGreen(previousX, previousY, islandEvent, headRadius);
  const closeEnough = minDistSq <= sinkRadius * sinkRadius;
  const believableHeight = currentY >= metrics.holeY - 34 && currentY <= metrics.holeY + 28;
  return descending && onGreenPath && closeEnough && believableHeight;
}

}

function didHeadPassThroughMovingRing(head, ring, previousX, previousY, currentX, currentY) {
  if (!head?.active || !ring?.sprite?.active || ring.spent) return false;
  if (!head.ringHeadId) {
    yorkRingHeadSerial += 1;
    head.ringHeadId = yorkRingHeadSerial;
  }
  if (ring.touchedHeadIds.has(head.ringHeadId)) return false;
  const ringX = ring.sprite.x;
  const ringY = ring.centerY ?? ring.sprite.y;
  // Compare both paths in ring-relative space so a moving ring can meet a
  // head that is nearly stationary at the top of its flight.
  const relativePreviousX = previousX - (ring.prevX ?? ringX);
  const relativePreviousY = previousY - (ring.prevY ?? ringY);
  const relativeCurrentX = currentX - ringX;
  const relativeCurrentY = currentY - ringY;
  const minDistSq = pointSegmentDistanceSq(0, 0, relativePreviousX, relativePreviousY, relativeCurrentX, relativeCurrentY);
  const headRadius = Math.max(6, (head.displayWidth || 30) * 0.18);
  const safeInner = Math.max(6, ring.innerRadius - headRadius);
  const rimOuter = ring.outerRadius + headRadius;
  const sweptRim = minDistSq <= rimOuter * rimOuter && minDistSq >= safeInner * safeInner;
  if (sweptRim) return false;
  const prevDist = Phaser.Math.Distance.Between(relativePreviousX, relativePreviousY, 0, 0);
  const currDist = Phaser.Math.Distance.Between(relativeCurrentX, relativeCurrentY, 0, 0);
  const crossedInterior = (prevDist > safeInner && currDist < safeInner) || (prevDist < safeInner && currDist > safeInner) || minDistSq < safeInner * safeInner;
  const minX = Math.min(relativePreviousX, relativeCurrentX) - safeInner;
  const maxX = Math.max(relativePreviousX, relativeCurrentX) + safeInner;
  const minY = Math.min(relativePreviousY, relativeCurrentY) - safeInner;
  const maxY = Math.max(relativePreviousY, relativeCurrentY) + safeInner;
  const nearRing = 0 >= minX && 0 <= maxX && 0 >= minY && 0 <= maxY;
  if (crossedInterior && nearRing) {
    ring.touchedHeadIds.add(head.ringHeadId);
    return true;
  }
  return false;
}

function cleanupYorkRingPlatformEvent(scene) {
  if (!yorkRingPlatformEvent) return;
  const e = yorkRingPlatformEvent;
  e.active = false;
  e.phase = 'finished';
  if (e.throwTimer) { e.throwTimer.remove(false); e.throwTimer = null; }
  if (e.activeRing) scene.tweens.killTweensOf(e.activeRing);
  if (e.activeRing?.sprite?.active) e.activeRing.sprite.destroy();
  e.activeRing = null;
  for (const actor of [e.leftPlatform,e.rightPlatform,e.leftGuard,e.rightGuard]) {
    if (actor) scene.tweens.killTweensOf(actor);
  }
  if (e.leftPlatform?.active) e.leftPlatform.destroy();
  if (e.rightPlatform?.active) e.rightPlatform.destroy();
  if (e.leftGuard?.active) e.leftGuard.destroy();
  if (e.rightGuard?.active) e.rightGuard.destroy();
  yorkRingPlatformEvent = null;
}

function minimumReachableYorkRingEventY(launchY, weaponMultiplier, platformHalfHeight) {
  // Wind changes between customers while the guards stay on stage. Place the
  // ring so a full-power shot can still reach its apex in the worst wind.
  const fullPowerSpeed = 500 * weaponMultiplier;
  const worstWind = 100;
  const verticalSpeed = Math.max(0, Math.sqrt(Math.max(0, fullPowerSpeed * fullPowerSpeed - worstWind * worstWind)) - worstWind);
  const highestHeadY = launchY - verticalSpeed * verticalSpeed / 800;
  return Math.ceil(highestHeadY + 80 + platformHalfHeight + 56 + YORK_RING_THROW_ARC_HEIGHT);
}

function spawnYorkRingPlatformEvent(scene) {

    x: leftGuardStopX,

    ease: 'Sine.easeOut'

    targets: rightPlatform,
    x: rightStopX,

          if (yorkRingPlatformEvent.activeRing) return;
          if (yorkRingPlatformEvent.throwCount >= yorkRingPlatformEvent.maxThrows) {
            yorkRingPlatformEvent.throwTimer.remove(false);
            yorkRingPlatformEvent.throwTimer = null;
            yorkRingPlatformEvent.phase = 'leaving';
            scene.tweens.add({
              targets: yorkRingPlatformEvent.leftGuard,
              x: yorkRingPlatformEvent.leftGuard.x - 70,
              duration: 420,
              ease: 'Sine.easeIn'
            });
            scene.tweens.add({
              targets: yorkRingPlatformEvent.rightGuard,
              x: yorkRingPlatformEvent.rightGuard.x + 70,
              duration: 420,
              ease: 'Sine.easeIn',
              onComplete: () => {
                if (!yorkRingPlatformEvent) return;
                scene.tweens.add({
                  targets: yorkRingPlatformEvent.leftPlatform,
                  x: offscreenPlatformX,

function pointSegmentDistanceSq(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  if (dx === 0 && dy === 0) {
    const dpx = px - x1;
    const dpy = py - y1;
    return dpx * dpx + dpy * dpy;
  }
  const t = Phaser.Math.Clamp(((px - x1) * dx + (py - y1) * dy) / (dx * dx + dy * dy), 0, 1);
  const nx = x1 + t * dx;
  const ny = y1 + t * dy;
  const ddx = px - nx;
  const ddy = py - ny;
  return ddx * ddx + ddy * ddy;
}

function segmentIntersectsExpandedRect(x1, y1, x2, y2, left, top, right, bottom, padding) {
  const minX = left - padding;
  const minY = top - padding;
  const maxX = right + padding;
  const maxY = bottom + padding;
  const dx = x2 - x1;
  const dy = y2 - y1;
  let tMin = 0;
  let tMax = 1;
  if (dx === 0) {
    if (x1 < minX || x1 > maxX) return false;
  } else {
    let tx1 = (minX - x1) / dx;
    let tx2 = (maxX - x1) / dx;
    if (tx1 > tx2) [tx1, tx2] = [tx2, tx1];
    tMin = Math.max(tMin, tx1);
    tMax = Math.min(tMax, tx2);
    if (tMin > tMax) return false;
  }
  if (dy === 0) {
    if (y1 < minY || y1 > maxY) return false;
  } else {
    let ty1 = (minY - y1) / dy;
    let ty2 = (maxY - y1) / dy;
    if (ty1 > ty2) [ty1, ty2] = [ty2, ty1];
    tMin = Math.max(tMin, ty1);
    tMax = Math.min(tMax, ty2);
    if (tMin > tMax) return false;
  }
  return true;
}

function didHeadSegmentHitTarget(head, target, x1, y1, x2, y2) {
  if (!target.body || !target.body.enable || target.collected) return false;
  const headRadius = Math.max(6, (head.displayWidth || 30) * 0.18);
  if (target.body.isCircle) {
    const centerX = target.body.center.x;
    const centerY = target.body.center.y;
    const radius = target.body.halfWidth + headRadius;
    return pointSegmentDistanceSq(centerX, centerY, x1, y1, x2, y2) <= radius * radius;
  }
  const barrelPadding = target.targetType === 'explodingBarrel' ? 4 : 0;
  return segmentIntersectsExpandedRect(
    x1,
    y1,
    x2,
    y2,
    target.body.left,
    target.body.top,
    target.body.right,
    target.body.bottom,
    headRadius + barrelPadding
  );
}

function checkFastHeadTargetCrossings(scene) {
  if (!bodyGroup || !targetGroup) return;
  const targets = targetGroup.getChildren();
  bodyGroup.getChildren().forEach(head => {
    if (!head.isHead || !head.active || !head.body || !head.body.enable) return;
    const prevX = head.prevX ?? head.x;
    const prevY = head.prevY ?? head.y;
    const movedFarEnough = Phaser.Math.Distance.Between(prevX, prevY, head.x, head.y) > 4;
    if (movedFarEnough) {
      if (yorkFlyingIslandEvent && yorkFlyingIslandEvent.active && !yorkFlyingIslandEvent.success) {
        if (didHeadSinkFlyingIslandHole(head, yorkFlyingIslandEvent, prevX, prevY, head.x, head.y)) {
          completeFlyingIslandHoleSuccess(scene, yorkFlyingIslandEvent, head);
          head.prevX = head.x;
          head.prevY = head.y;
          return;
        }
        handleFlyingIslandGreenBounce(scene, head, yorkFlyingIslandEvent);
      }
    }
    if (yorkRingPlatformEvent && yorkRingPlatformEvent.activeRing && !yorkRingPlatformEvent.activeRing.spent) {
      const ring = yorkRingPlatformEvent.activeRing;
      if (didHeadPassThroughMovingRing(head, ring, prevX, prevY, head.x, head.y)) {
        ring.spent = true;
        clearAllTargetsFromRingEvent(scene, head);
        scene.tweens.killTweensOf(ring);
        if (ring.sprite && ring.sprite.active) ring.sprite.destroy();
        yorkRingPlatformEvent.activeRing = null;
      }
    }
    if (movedFarEnough) {
      for (let i = 0; i < targets.length; i++) {
        const target = targets[i];
        if (didHeadSegmentHitTarget(head, target, prevX, prevY, head.x, head.y)) {
          handleTargetHit(scene, target, head);
          break;
        }
      }
    }
    head.prevX = head.x;
    head.prevY = head.y;
  });
  const activeRing = yorkRingPlatformEvent?.activeRing;
  if (activeRing?.sprite?.active) {
    activeRing.prevX = activeRing.sprite.x;
    activeRing.prevY = activeRing.centerY ?? activeRing.sprite.y;
  }
}

function birdFlightLane(weaponMultiplier, launchY) {
  // A full-power vertical shot should climb past the bird with room to aim.
  // Stronger blades bring later flocks higher, but never into the mobile HUD.
  const maximumRise = Math.pow(500 * weaponMultiplier, 2) / 800;
  return Math.max(420, Math.min(760, Math.round(launchY - maximumRise + 80)));
}

function spawnBird(scene) {
  if (targetGroup.getChildren().some(target => target.targetType === 'bird' && target.active && !target.collected)) return;
  const launchY = prisoner.y + prisonerHead.y;
  const weaponMultiplier = getWeaponPowerMultiplier();
  const laneY = birdFlightLane(weaponMultiplier, launchY);
  const windY = FEATURES.weather && currentWeather === 'wind' ? windForce.y : 0;
  const fullPowerRise = Math.pow(Math.max(0, 500 * weaponMultiplier - windY), 2) / 800;
  if (launchY - fullPowerRise > laneY) return;
  const fromRight = Phaser.Math.Between(0, 1) === 1;
  const startX = fromRight ? 850 : -50;
  const endX = fromRight ? -50 : 850;
  // Teach the bonus first. Reputation-costing doves join after a few upgrades.
  const kind = player.weaponLevel < 4 ? 'crow' : (Phaser.Math.Between(0, 1) ? 'dove' : 'crow');
  const bird = scene.add.container(startX, laneY).setDepth(20);
  bird.targetType = 'bird';
  bird.birdKind = kind;
  bird.fromRight = fromRight;
  createTargetAppearance(scene, bird, 'bird');
  scene.physics.world.enable(bird);
  bird.body.setAllowGravity(false);
  bird.body.setImmovable(true);
  // The art faces either way; include its head and beak on both sides.
  bird.body.setSize(100,50);
  bird.body.setOffset(-50,-20);
  bird.collected = false;
  bird.jester = null;
  targetGroup.add(bird);
  applyTargetWeather(scene, bird);
  bird.moveTween = scene.tweens.add({
    targets: bird,
    x: endX,
    duration: 3000,
    ease: 'Linear',
    yoyo: true,
    repeat: 0,
    onYoyo: () => {
      if (bird.birdSprite) bird.birdSprite.setScale(fromRight?1:-1,1);
    },
    onComplete: () => bird.destroy()
  });
  bird.once('destroy',()=>bird.moveTween?.stop());
}

function pickSpacedTargetX(existingTargetXs = []) {
  const minX = 100;
  const maxX = 700;
  const minSpacing = 90;
  const maxAttempts = 12;
  let candidate = Phaser.Math.Between(minX, maxX);

  for (let i = 0; i < maxAttempts; i++) {
    candidate = Phaser.Math.Between(minX, maxX);
    const tooClose = existingTargetXs.some((x) => Math.abs(x - candidate) < minSpacing);
    if (!tooClose) return candidate;
  }

  return candidate;
}

function spawnTarget(scene, existingTargetXs = []) {
  const type = chooseTargetType();
  if (type === 'holyMonk') {
    spawnHolyMonk(scene);
    return;
  }
  if (type === 'royal') {
    spawnRoyal(scene);
    return;
  }
  const fromRight = Phaser.Math.Between(0, 1) === 1;
  const startX = fromRight ? 850 : -50;
  const targetX = pickSpacedTargetX(existingTargetXs);
  existingTargetXs.push(targetX);
  const isYorkTallWaver = currentCity === 'London' && player.weaponLevel >= 8 && type === 'standard' && Phaser.Math.Between(1, 100) <= 35;
  // Reserve the upper quarter for the mobile HUD and the target's radius.
  const maxVisiblePoleHeight = Math.max(540, CHARACTER_BASE_Y - 20 - GAME_HEIGHT * .25);
  const tallPoleMax = Math.min(900, maxVisiblePoleHeight);
  const poleHeight = isYorkTallWaver
    ? Phaser.Math.Between(540, tallPoleMax)
    : Phaser.Math.Between(80, 180);

  // Ensure jesters render above the lighting overlay and other background elements.
  const jester = scene.add.container(startX, CHARACTER_BASE_Y).setDepth(20);
  jester.startFromRight = fromRight;
  const body = scene.add.image(0, 50, 'jesterBody1').setOrigin(0.5, 1);
  const pole = scene.add.rectangle(0, -20, 6, poleHeight, 0x8b4513)
    .setOrigin(0.5, 1);
  jester.add([pole, body]);

  const target = scene.add.container(startX, CHARACTER_BASE_Y - 20 - poleHeight).setDepth(20);
  target.targetType = type;
  target.isYorkTallWaver = isYorkTallWaver;
  target.fameMultiplier = isYorkTallWaver ? 3 : 1;
  target.yorkWaveTween = null;
  target.jesterPole = pole;
  target.poleHeight = poleHeight;
  createTargetAppearance(scene, target, type);

  const isEligibleForStandardMove = !isYorkTallWaver;
  const shouldMoveWoodenShield = type === 'woodenShield' && killStreak >= 3;
  const shouldMoveStandard = type !== 'woodenShield' && isEligibleForStandardMove && FEATURES.movingTargets && Phaser.Math.Between(0, 1) === 1;
  const shouldStartMoveTweenAfterEntrance = shouldMoveWoodenShield || shouldMoveStandard;
  const moveTweenDuration = shouldMoveWoodenShield && killStreak >= 10 ? 400 : 800;

  if (shouldStartMoveTweenAfterEntrance) {
    target.isMoving = true;
  }

  let jBodyKey = 'jesterBody1';
  if (type === 'woodenShield') {
    jBodyKey = 'jesterBody2';
  } else if (type === 'explodingBarrel') {
    jBodyKey = 'jesterBody3';
  }
  if (target.isMoving) {
    jBodyKey = 'jesterBody4';
  }
  CastArt.jester(body,jBodyKey);

  target.collected = false;
  target.jester = jester;
  target.barrelArmed = false;
  target.barrelExploded = false;
  target.barrelBlinkEvent = null;
  target.barrelPulseTween = null;
  targetGroup.add(target);
  applyTargetWeather(scene, target);

  scene.tweens.add({
    targets: [jester, target],
    x: targetX,
    duration: 1500,
    ease: 'Linear',
    onComplete: () => {
      if (shouldStartMoveTweenAfterEntrance) {
        target.moveTween = scene.tweens.add({
          targets: target,
          y: target.y - 20,
          duration: moveTweenDuration,
          yoyo: true,
          repeat: -1,
          ease: 'Sine.easeInOut'
        });
      }
      scene.physics.world.enable(target);
      if (type === 'explodingBarrel') {
        // Include the fuse above the barrel in the hitbox and widen it slightly
        // so the barrels are a bit easier to hit.
        target.body.setSize(40, 56);
        target.body.setOffset(-20, -30);
        target.body.x = target.x + target.body.offset.x;
        target.body.y = target.y + target.body.offset.y;
      } else {
        const targetRadius = target.isYorkTallWaver ? 30 : 20;
        target.body.setCircle(targetRadius);
        target.body.setOffset(-targetRadius, -targetRadius);
        target.body.x = target.x - target.body.halfWidth;
        target.body.y = target.y - target.body.halfHeight;
      }
      target.body.setAllowGravity(false);
      target.body.setImmovable(true);
      if (target.isYorkTallWaver) {
        const maxArcOffset = 50;
        const arcAngle = Math.asin(Math.min(0.2, maxArcOffset / target.poleHeight));
        const waveState = { angle: -arcAngle };
        target.yorkWaveTween = scene.tweens.add({
          targets: waveState,
          angle: arcAngle,
          duration: 1400,
          yoyo: true,
          repeat: -1,
          ease: 'Sine.easeInOut',
          onUpdate: () => {
            if (!target.active || !jester.active) return;
            const pivotX = jester.x;
            const pivotY = jester.y - 20;
            const s = Math.sin(waveState.angle);
            const c = Math.cos(waveState.angle);
            target.x = pivotX + s * target.poleHeight;
            target.y = pivotY - c * target.poleHeight;
            target.jesterPole.setRotation(waveState.angle);
            if (target.body) {
              if (type === 'explodingBarrel') {
                target.body.x = target.x + target.body.offset.x;
                target.body.y = target.y + target.body.offset.y;
              } else {
                target.body.x = target.x - target.body.halfWidth;
                target.body.y = target.y - target.body.halfHeight;
              }
            }
          }
        });
      }
      if (FEATURES.birds && Phaser.Math.Between(1, 6) === 1) {
        scene.time.delayedCall(2000, () => spawnBird(scene));
      }
    },
    onUpdate: () => {
      if (target.body) {
        if (type === 'explodingBarrel') {
          target.body.x = target.x + target.body.offset.x;
          target.body.y = target.y + target.body.offset.y;
        } else {
          target.body.x = target.x - target.body.halfWidth;
          target.body.y = target.y - target.body.halfHeight;
        }
      }
    }
  });
}

function addXP(scene, amount) {
  if (!Number.isFinite(amount) || amount <= 0) return;
  xp = Math.min(Number.MAX_SAFE_INTEGER, xp + amount);
  const previousLevel = level;
  while (xp >= xpThreshold) {
    xp -= xpThreshold;
    level++;
    xpThreshold = Math.floor(xpThreshold * 1.33);
  }
  if (level > previousLevel) onLevelUp(scene);
  updateXPUI();
  SaveManager.save();
}

function updateXPUI() {
  xpText.setText(`Level ${level} - ${xp}/${xpThreshold} XP`);
  const maxWidth = 300;
  xpBarFill.displayWidth = maxWidth * (xp / xpThreshold);
}

function onLevelUp(scene) {
  if (window.MobileGame) {
    const reached=level;
    scene.time.delayedCall(650,()=>window.MobileGame.rankUp(reached));
    return;
  }
  const msg = scene.add.text(CENTER_X, CENTER_Y, 'LEVEL UP!', { font: '48px monospace', fill: '#ffff00' })
    .setOrigin(0.5)

  scene.cameras.main.flash(250, 255, 255, 255);
  scene.tweens.add({
    targets: msg,
    y: 250,
    alpha: 0,
    duration: 1000,
    onComplete: () => msg.destroy()
  });
  updateUnlockButtons(scene, true);
}

function updateUnlockButtons(scene, fromLevelUp = false) {
  if (window.MobileGame) return;
  if (level >= 2 && !weaponsButton.visible) {
    weaponsButton.setVisible(true).setInteractive();
    if (fromLevelUp) showUnlockMessage(scene, 'Weapons Unlocked', 500);
  }
  if (level >= 5 && !travelButton.visible) {
    travelButton.setVisible(true).setInteractive();
    if (fromLevelUp) showUnlockMessage(scene, 'Travel Unlocked', 500);
  }
  if (level >= 10) {
    let newlyVisible = false;
    if (!shopButton.visible) {
      shopButton.setVisible(true).setInteractive();
      newlyVisible = true;
    }
    if (!storageButton.visible) {
      storageButton.setVisible(true).setInteractive();
      newlyVisible = true;
    }
    if (fromLevelUp && newlyVisible) showUnlockMessage(scene, 'Shopping Unlocked', 500);
  }
}

function update(time, delta) {

  if (!gameStarted || menuOpen) return;
  if (this.launchGuide) {
    this.launchGuide.clear();
    if (awaitingPower && prisoner.visible) {
      const points=ChopCore.launchPreview(selectedAngle,aimArrow.scaleY,getWeaponPowerMultiplier(),FEATURES.weather && currentWeather==='wind'?windForce:{x:0,y:0},FEATURES.weather && currentWeather==='rain');
      points.forEach((point,i)=>{
        const x=prisoner.x+prisonerHead.x+point.x,y=prisoner.y+prisonerHead.y+point.y;
        if(x<12 || x>GAME_WIDTH-12 || y<GAME_HEIGHT*.25 || y>STAGE_Y) return;
        this.launchGuide.fillStyle(0x152b31,.8).fillCircle(x,y,6-i*.25);
        this.launchGuide.fillStyle(0xf9c66b,.95-i*.075).fillCircle(x,y,4-i*.25);
      });
    }
  }

  if (this.dayNight) {
    this.dayNight.update(delta / 1000);
  }

  if (FEATURES.clouds && cloudLayerFar && cloudLayerNear) {
    const daylight=.5*(1-Math.cos((this.dayNight?.timeOfDay ?? .5)*Math.PI*2));
    const cloudChannel=(night,day)=>Math.round(night+(day-night)*daylight);
    const cloudTint=(cloudChannel(100,255)<<16)|(cloudChannel(132,255)<<8)|cloudChannel(153,255);
    cloudLayerFar.getChildren().forEach(cloud => {
      cloud.x -= 12 * delta / 1000;
      if (cloud.x < -cloud.width / 2) {
        cloud.x = config.width + cloud.width / 2;
        cloud.y = Phaser.Math.Between(CLOUD_MIN_Y, CLOUD_MAX_Y);
        cloud.setAlpha(Phaser.Math.FloatBetween(0.4, 0.6));
        cloud.setScale(Phaser.Math.FloatBetween(0.8, 1.2));
      }
    });
    cloudLayerNear.getChildren().forEach(cloud => {
      cloud.setTint(cloudTint);
      cloud.x -= 24 * delta / 1000;
      if (cloud.x < -cloud.width / 2) {
        cloud.x = config.width + cloud.width / 2;
        cloud.y = Phaser.Math.Between(CLOUD_MIN_Y + 20, CLOUD_MAX_Y);
        cloud.setAlpha(Phaser.Math.FloatBetween(0.4, 0.6));
        cloud.setScale(Phaser.Math.FloatBetween(0.8, 1.2));
      }
    });
  }

  // Move cursor
  if (swingActive) {
    const motion = ChopCore.advanceMeter(cursor.x, swingDirection, swingSpeed * 60, delta / 1000);
    cursor.x = motion.position;
    swingDirection = motion.direction;
  }

  // Apply extra gravity once heads start falling in the rain
  if (FEATURES.weather && currentWeather === 'rain' && bodyGroup) {
    bodyGroup.getChildren().forEach(obj => {
      if (obj.isHead && !obj.rainGravityApplied && obj.body.velocity.y > 0) {
        obj.body.setGravityY(300);
        obj.rainGravityApplied = true;
      }
    });
  }


  checkFastHeadTargetCrossings(this);
  updateYorkRingPlatformEvent(this);
  updateFlyingIslandEvent(this, yorkFlyingIslandEvent);

  // Splash when heads hit the blood pool
  if (bloodPool && bloodEmitter && bodyGroup) {
    const surfaceY = bloodPool.y - bloodPool.displayHeight;
    bodyGroup.getChildren().forEach(obj => {
      if (obj.isHead && !obj.hasSplashed && obj.y + obj.displayHeight / 2 >= surfaceY) {
        obj.hasSplashed = true;
        const depth = Math.min(bloodPool.displayHeight, 100);
        const ratio = depth / 100;
        const qty = Math.floor(10 + 40 * ratio);
        const minSpeed = 150 + 50 * ratio;
        const maxSpeed = 250 + 50 * ratio;
        bloodEmitter.setSpeed({ min: minSpeed, max: maxSpeed });
        bloodEmitter.explode(qty, obj.x, surfaceY);
        bloodEmitter.setSpeed({ min: 150, max: 250 });
      }
    });
  }
}

class TravelScene extends Phaser.Scene {
  constructor() { super({key:'TravelScene'}); }
  init(data) { this.city=data.city;this.days=Math.max(1,data.days);this.mainScene=data.mainScene;this.elapsed=0;this.finished=false; }
  create() {
    this.duration=Math.max(2500,this.days*1100);
    this.add.rectangle(CENTER_X,CENTER_Y,GAME_WIDTH,GAME_HEIGHT,0x89afa8).setDepth(-5);
    this.add.image(CENTER_X,CENTER_Y,'angularRoad').setDepth(-2);
    createCloudTextures(this);
    this.clouds=[];
    for(let i=0;i<7;i++)this.clouds.push(this.add.image(i*135,330+(i%3)*90,i%2?'cloud-big':'cloud-small').setDepth(i%2?-1:-3).setScale(.7+(i%3)*.3).setAlpha(.65));
    this.add.text(CENTER_X,230,'THE ROAD TO '+this.city.name.toUpperCase(),{font:'bold 32px Georgia',color:'#e9d8b4',backgroundColor:'#25343b',padding:{x:24,y:14}}).setOrigin(.5);
    this.date=this.add.text(CENTER_X,310,'',{font:'24px Georgia',color:'#25343b'}).setOrigin(.5);
    this.label=this.add.text(CENTER_X,1410,'',{font:'22px Georgia',color:'#e9d8b4',backgroundColor:'#25343b',padding:{x:18,y:10}}).setOrigin(.5);
    this.progress=this.add.rectangle(100,1460,0,8,0xe2b668).setOrigin(0,.5);
    this.dayNight=new DayNightCycle({dayLengthSeconds:this.duration/this.days/1000});
    this.dayNight.init(this,{overlayDepth:5,celestialDepth:6});this.dayNight.timeOfDay=this.mainScene.dayNight.timeOfDay;
    this.caravan=CastArt.caravan(this,player.storageLevel,410,1170).setDepth(10);
    this.exec=this.add.image(570,1200,'executionerFigure').setOrigin(.5,1).setDisplaySize(115,175).setDepth(11);
    this.tweens.add({targets:this.exec,y:1194,angle:{from:-2,to:2},duration:210,yoyo:true,repeat:-1});
    const labels=player.storageLevel<2?'You and your dog':player.storageLevel<3?'Your pack horse':'Your trading cart';
    this.label.setText(labels+' · '+this.days+' days on the road');
    window.MobileGame?.journeyStart(this);
  }
  update(time,delta) {
    if(this.finished)return;
    this.elapsed+=delta;this.dayNight.update(delta/1000);
    const travelled=Math.min(this.days,Math.floor(this.elapsed/this.duration*this.days));
    const calendarDay=(currentMonth*30+currentDay-1+travelled)%360;
    this.date.setText((calendarDay%30+1)+' '+months[Math.floor(calendarDay/30)]+' · '+travelled+' / '+this.days+' days');
    this.progress.displayWidth=600*Math.min(1,this.elapsed/this.duration);
    this.clouds.forEach((cloud,i)=>{cloud.x-=delta/1000*(i%2?90:35);if(cloud.x < -cloud.displayWidth)cloud.x=GAME_WIDTH+cloud.displayWidth;});
    if(this.elapsed>=this.duration)this.finish();
  }
  finish() {
    if(this.finished)return;this.finished=true;
    advanceDays(this.days);this.city.unlocked=true;Campaign.visit(this.city.name);
    selectCity(this.mainScene,this.city);dailyMarketUpdate();SaveManager.performSave();
    window.MobileGame?.journeyFinish(this.city.name);
    this.scene.stop();this.mainScene.scene.resume();
  }
}

// This fallback also works when the engine failed before game setup could run.
if (!window.Phaser || !window.ChopCore || !window.Campaign || !window.DayNightCycle || !window.CastArt || !window.MobileGame) {
  const gate = document.getElementById('start-overlay');
  if (gate) {
    gate.querySelector('.tap').textContent = 'Download interrupted · tap to retry';
    gate.querySelector('small').textContent = 'Check your connection, then try again. Your saved progress stays on this device.';
    gate.setAttribute('aria-label', 'Retry game download');
    gate.tabIndex = 0;
    const retry = event => { event.preventDefault(); event.stopImmediatePropagation(); location.reload(); };
    gate.addEventListener('click', retry, true);
    gate.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') retry(event); }, true);
  }
}
</script>
